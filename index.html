<!doctype html>
<html lang="en-IN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDU 360 Prototype V3.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>

/* =====================================================================
   EDU 360 · STILLWATER DESIGN TOKENS · v2.0
   Tier 1 = primitives (raw values, never used directly in components)
   Tier 2 = semantic tokens (what components consume)
   Tier 3 = component tokens (only where a component needs its own value)
   This is the ONLY token block in the system.
   ===================================================================== */
:root{
  /* ---------- Tier 1 · Primitives (Stillwater v2.1, adopted from the approved student prototype) ---------- */
  --p-neutral-0:#FFFFFF; --p-neutral-50:#F3F6F3; --p-neutral-100:#EAF0EC; --p-neutral-150:#E1EAE4; --p-neutral-200:#DDE6E0;
  --p-neutral-500:#7A8C83; --p-neutral-600:#596B63; --p-neutral-900:#1C302D;
  --p-green-100:#DCEBE3; --p-green-700:#2D6154; --p-green-800:#214A40;
  --p-gold-50:#F8EBDD; --p-gold-200:#E7C08C; --p-gold-300:#DFAE68; --p-gold-ink:#27362F;
  --p-blue-50:#E7EDF5; --p-rose-50:#F5E6E3;
  --p-success-700:#245A3A; --p-success-100:#E5F2E8; --p-success-400:#7BA88A;
  --p-warning-700:#684A12; --p-warning-100:#F6EEDB; --p-warning-400:#B69A5D;
  --p-danger-700:#9B4038;  --p-danger-100:#F7E6E3;  --p-danger-400:#B5473C;
  --p-info-700:#234B61;    --p-info-100:#DDE9F2;    --p-info-400:#779EB4;
  --p-focus-600:#216EAE;
  /* dark primitives */
  --p-dk-canvas:#141D1B; --p-dk-surface:#1C2824; --p-dk-surface-2:#26352F; --p-dk-surface-3:#30433B; --p-dk-border:#34463E; --p-dk-control:#6F8579;
  --p-dk-text:#EDF4EF; --p-dk-muted:#B5C4BC; --p-dk-brand:#A7D0BA; --p-dk-brand-strong:#C1E0CD; --p-dk-brand-soft:#2C4237;
  --p-dk-accent:#E9BC7D; --p-dk-accent-soft:#473A2B; --p-dk-blue-soft:#2D3948; --p-dk-rose-soft:#432F2D; --p-dk-hero:#2D4A3E;

  /* ---------- Tier 2 · Semantic (light theme) ---------- */
  --color-bg-canvas:var(--p-neutral-50);
  --color-bg-surface:var(--p-neutral-0);
  --color-bg-subtle:var(--p-neutral-100);
  --color-bg-subtle-strong:var(--p-neutral-150);
  --color-bg-input:var(--p-neutral-50);          /* filled inputs */
  --color-bg-brand-soft:var(--p-green-100);
  --color-bg-accent-soft:var(--p-gold-50);       /* "next up", "due soon" chips, avatar */
  --color-bg-info-soft:var(--p-blue-50);         /* "later" chips, subject tiles */
  --color-bg-rose-soft:var(--p-rose-50);         /* subject tiles */
  --color-bg-warm:var(--p-rose-50);
  --color-bg-disabled:var(--p-neutral-100);
  --color-text:var(--p-neutral-900);
  --color-text-muted:var(--p-neutral-600);
  --color-text-brand:var(--p-green-700);
  --color-text-brand-strong:var(--p-green-800);
  --color-text-on-brand:#FFFFFF;
  --color-text-on-accent:var(--p-gold-ink);
  --color-text-on-danger:#FFFFFF;
  --color-text-disabled:var(--p-neutral-500);
  --color-border-divider:var(--p-neutral-200);   /* decorative only (1.28:1) */
  --color-border-control:var(--p-neutral-500);   /* inputs, selects, secondary buttons (3.27:1 on filled input) */
  --color-border-disabled:var(--p-neutral-200);
  --color-action-primary:var(--p-green-700);
  --color-action-primary-hover:var(--p-green-800);
  --color-action-accent:var(--p-gold-200);       /* hero call-to-action only */
  --color-action-accent-hover:var(--p-gold-300);
  --color-action-danger:var(--p-danger-700);
  --color-action-danger-hover:#7E322C;
  --color-accent:var(--p-gold-300);              /* decorative: kicker dot, illustration; never text on light */
  --color-focus:var(--p-focus-600);
  --color-overlay:rgba(16,24,20,.56);
  --color-hero-bg:var(--p-green-700); --color-hero-text:#FFFFFF; --color-hero-muted:#E1EAE4; --color-hero-kicker:#D6E9DC;
  --color-toast-bg:var(--p-neutral-900); --color-toast-text:#FFFFFF;
  --color-toast-success:#A7D0BA; --color-toast-danger:#F0A49A; --color-toast-info:#A9CBE3; --color-toast-hover:rgba(255,255,255,.14);
  --color-hero-line:rgba(255,255,255,.3); --color-hero-line-faint:rgba(255,255,255,.16); --color-hero-glow:rgba(255,255,255,.05); --color-hero-glow-faint:rgba(255,255,255,.03); --color-hero-star:#F5F1E8;
  --color-spinner-track-on-brand:rgba(255,255,255,.35);
  --color-print-paper:#FFFFFF; --color-print-ink:#000000; --color-print-muted:#333333; --color-print-rule:#999999;
  --color-status-success-fg:var(--p-success-700); --color-status-success-bg:var(--p-success-100); --color-status-success-border:var(--p-success-400);
  --color-status-warning-fg:var(--p-warning-700); --color-status-warning-bg:var(--p-warning-100); --color-status-warning-border:var(--p-warning-400);
  --color-status-danger-fg:var(--p-danger-700);   --color-status-danger-bg:var(--p-danger-100);   --color-status-danger-border:var(--p-danger-400);
  --color-status-info-fg:var(--p-info-700);       --color-status-info-bg:var(--p-info-100);       --color-status-info-border:var(--p-info-400);
  --color-status-neutral-fg:var(--p-neutral-900); --color-status-neutral-bg:var(--p-neutral-100); --color-status-neutral-border:var(--p-neutral-500);
  /* data visualisation · categorical (all ≥ 5:1 on surface). Also used for class-type markers. */
  --color-dv-1:#2D6154; --color-dv-2:#315F86; --color-dv-3:#8C6A1F; --color-dv-4:#9B4038; --color-dv-5:#6B5A8E; --color-dv-6:#2E7A80;
  --color-dv-grid:var(--p-neutral-200);
  /* sequential (light → dark) */
  --color-seq-1:#DCEBE3; --color-seq-2:#A6C9B6; --color-seq-3:#6A9A85; --color-seq-4:#2D6154; --color-seq-5:#214A40;

  /* ---------- Typography ---------- */
  --font-display:"Manrope","Noto Sans Devanagari","Noto Sans Kannada",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"DM Sans","Noto Sans Devanagari","Noto Sans Kannada",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-display:40px; --lh-display:1.1;  --ls-display:-0.045em;  /* greeting, sign-in title */
  --fs-h1:32px; --lh-h1:1.12; --ls-h1:-0.04em;   /* hero headline, page title */
  --fs-h2:22px; --lh-h2:1.25; --ls-h2:-0.03em;
  --fs-h3:19px; --lh-h3:1.25; --ls-h3:-0.025em;  /* panel heading */
  --fs-h4:16px; --lh-h4:1.4;
  --fs-body-lg:16px; --fs-body:14px; --fs-body-sm:13px; --fs-label:13px; --fs-caption:12px; --fs-overline:12px;
  --fs-input:16px;  /* 16px prevents mobile browser zoom on focus */
  --fs-metric:30px;
  --lh-body:1.55; --lh-tight:1.3;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-extrabold:800;

  /* ---------- Spacing (4 px base) ---------- */
  --space-0:0; --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;

  /* ---------- Shape ---------- */
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px; --radius-xl:28px; --radius-pill:999px;
  --border-width:1px; --border-width-strong:2px;

  /* ---------- Sizing ---------- */
  --control-height:48px;          /* inputs, selects */
  --button-height:44px;           /* default buttons */
  --control-height-compact:40px;  /* dense desktop tables only; becomes 44px on touch */
  --target-min:44px;              /* minimum touch target (exceeds WCAG 2.2 AA 24px) */
  --icon-sm:16px; --icon-md:20px; --icon-lg:24px;
  --sidebar-width:232px; --sidebar-rail:72px; --topbar-height:64px;
  --content-max:1280px; --reading-max:72ch;

  /* ---------- Elevation (borders first; shadows only for floating layers) ---------- */
  --elevation-0:none;
  --elevation-card:0 4px 14px rgba(36,65,54,.05);   /* floating sidebar, auth card base */
  --elevation-raised:0 22px 70px rgba(28,48,45,.07); /* sign-in card */
  --elevation-1:0 2px 8px rgba(28,48,45,.08);   /* menus, popovers */
  --elevation-2:0 8px 24px rgba(28,48,45,.12);  /* drawers, sticky bars */
  --elevation-3:0 16px 48px rgba(28,48,45,.18); /* modals, toasts */

  /* ---------- Layering ---------- */
  --z-base:0; --z-sticky:100; --z-dropdown:200; --z-drawer:300; --z-modal:1000; --z-toast:1100; --z-tooltip:1200;

  /* ---------- Motion ---------- */
  --motion-fast:120ms; --motion-base:180ms; --motion-slow:260ms;
  --ease-standard:cubic-bezier(.2,0,0,1); --ease-exit:cubic-bezier(.3,0,1,1);

  /* ---------- Focus ---------- */
  --focus-ring-width:3px; --focus-ring-offset:2px;
}

/* ---------- Tier 2 · Semantic (dark theme · Beta) ---------- */
[data-theme="dark"]{
  --color-bg-canvas:var(--p-dk-canvas); --color-bg-surface:var(--p-dk-surface); --color-bg-subtle:var(--p-dk-surface-2); --color-bg-subtle-strong:var(--p-dk-surface-3);
  --color-bg-input:var(--p-dk-canvas);
  --color-bg-brand-soft:var(--p-dk-brand-soft); --color-bg-accent-soft:var(--p-dk-accent-soft); --color-bg-info-soft:var(--p-dk-blue-soft); --color-bg-rose-soft:var(--p-dk-rose-soft);
  --color-bg-warm:var(--p-dk-rose-soft); --color-bg-disabled:var(--p-dk-surface-2);
  --color-text:var(--p-dk-text); --color-text-muted:var(--p-dk-muted); --color-text-brand:var(--p-dk-brand); --color-text-brand-strong:var(--p-dk-brand-strong);
  --color-text-on-brand:#172720; --color-text-on-danger:#2A1210; --color-text-disabled:#7F9188;
  --color-border-divider:var(--p-dk-border); --color-border-control:var(--p-dk-control); --color-border-disabled:var(--p-dk-border);
  --color-action-primary:var(--p-dk-brand); --color-action-primary-hover:var(--p-dk-brand-strong);
  --color-action-accent:var(--p-dk-accent); --color-action-accent-hover:#F0CB96;
  --color-action-danger:#F0A49A; --color-action-danger-hover:#F6BFB7;
  --color-accent:var(--p-dk-accent);
  --color-focus:#7DB7EA; --color-overlay:rgba(0,0,0,.66);
  --color-hero-bg:var(--p-dk-hero); --color-hero-text:#F0F5EF; --color-hero-muted:#D5E2DA; --color-hero-kicker:var(--p-dk-brand-strong);
  --color-toast-bg:var(--p-dk-text); --color-toast-text:var(--p-dk-surface);
  --color-toast-success:#2D6154; --color-toast-danger:#9B4038; --color-toast-info:#234B61; --color-toast-hover:rgba(28,40,36,.1);
  --color-spinner-track-on-brand:rgba(23,39,32,.3);
  --color-status-success-fg:#9FD3B2; --color-status-success-bg:#1E3428; --color-status-success-border:#4F8463;
  --color-status-warning-fg:#E8C987; --color-status-warning-bg:#3A3020; --color-status-warning-border:#8E7543;
  --color-status-danger-fg:#F0A49A;  --color-status-danger-bg:#3D2321;  --color-status-danger-border:#A0574D;
  --color-status-info-fg:#A9CBE3;    --color-status-info-bg:#1F3140;    --color-status-info-border:#557C96;
  --color-status-neutral-fg:var(--p-dk-text); --color-status-neutral-bg:var(--p-dk-surface-2); --color-status-neutral-border:var(--p-dk-control);
  --color-dv-1:#A7D0BA; --color-dv-2:#86B4DA; --color-dv-3:#E9BC7D; --color-dv-4:#E58A7E; --color-dv-5:#B3A3D6; --color-dv-6:#7FC3C8;
  --color-dv-grid:var(--p-dk-border);
  --color-seq-1:#2C4237; --color-seq-2:#3E6450; --color-seq-3:#6A9A85; --color-seq-4:#A7D0BA; --color-seq-5:#C1E0CD;
  --elevation-card:0 4px 14px rgba(0,0,0,.14); --elevation-raised:0 22px 70px rgba(0,0,0,.28);
  --elevation-1:0 2px 8px rgba(0,0,0,.4); --elevation-2:0 8px 24px rgba(0,0,0,.5); --elevation-3:0 16px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* =====================================================================
   BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-bg-canvas);color:var(--color-text);font:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-body);font-feature-settings:"kern"}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--color-text);margin:0}
h1{font-size:var(--fs-h1);line-height:var(--lh-h1);letter-spacing:var(--ls-h1);font-weight:var(--fw-bold)}
h2{font-size:var(--fs-h2);line-height:var(--lh-h2);letter-spacing:var(--ls-h2);font-weight:var(--fw-bold)}
h3{font-size:var(--fs-h3);line-height:var(--lh-h3);letter-spacing:var(--ls-h3);font-weight:var(--fw-bold)}
h4{font-size:var(--fs-h4);line-height:var(--lh-h4);letter-spacing:-0.015em;font-weight:var(--fw-bold)}
p{margin:0 0 var(--space-3)}
ul,ol{margin:0 0 var(--space-3);padding-left:var(--space-6)}
li{margin-bottom:var(--space-1)}
a{color:var(--color-text-brand);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
code{font-family:var(--font-mono);font-size:12px;background:var(--color-bg-subtle);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
hr{border:0;border-top:var(--border-width) solid var(--color-border-divider);margin:var(--space-6) 0}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:var(--focus-ring-width) solid var(--color-focus);outline-offset:var(--focus-ring-offset)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--color-text-muted)}
.caption{font-size:var(--fs-caption);color:var(--color-text-muted)}
.overline{font:var(--fw-bold) var(--fs-overline)/1.4 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted);margin:0 0 var(--space-1)}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.skip-link{position:absolute;left:var(--space-4);top:-100px;z-index:var(--z-tooltip);background:var(--color-bg-surface);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);box-shadow:var(--elevation-2)}
.skip-link:focus{top:var(--space-4)}
.icon{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.icon--sm{width:var(--icon-sm);height:var(--icon-sm)} .icon--lg{width:var(--icon-lg);height:var(--icon-lg)}
.stack{display:grid;gap:var(--space-4)} .stack--sm{gap:var(--space-2)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.row--lg{gap:var(--space-4)}
.grid{display:grid;gap:var(--space-4)}
.grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid--4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* =====================================================================
   COMPONENTS · single canonical set
   ===================================================================== */
/* --- Card / panel --- */
.card{position:relative;background:var(--color-bg-surface);border:var(--border-width) solid var(--color-border-divider);border-radius:var(--radius-lg);padding:var(--space-4);min-width:0}
.card--subtle{background:var(--color-bg-subtle)}
.card__title{font:var(--fw-bold) var(--fs-h4)/var(--lh-h4) var(--font-display);margin:0 0 var(--space-2)}

/* --- Buttons --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--button-height);min-width:var(--target-min);padding:0 var(--space-4);border:var(--border-width) solid transparent;border-radius:var(--radius-md);font:var(--fw-semibold) var(--fs-body)/1.2 var(--font-body);text-decoration:none;cursor:pointer;transition:background-color var(--motion-fast) var(--ease-standard),border-color var(--motion-fast) var(--ease-standard);white-space:normal;text-align:center}
.btn--primary{background:var(--color-action-primary);color:var(--color-text-on-brand)}
.btn--primary:hover:not(:disabled){background:var(--color-action-primary-hover)}
.btn--secondary{background:var(--color-bg-surface);color:var(--color-text);border-color:var(--color-border-control)}
.btn--secondary:hover:not(:disabled){background:var(--color-bg-subtle)}
.btn--tertiary{background:transparent;color:var(--color-text-brand);text-decoration:underline;text-underline-offset:3px;text-decoration-color:transparent}
.btn--tertiary:hover:not(:disabled){text-decoration-color:currentColor;background:var(--color-bg-subtle)}
.btn--danger{background:var(--color-action-danger);color:var(--color-text-on-danger)}
.btn--danger:hover:not(:disabled){background:var(--color-action-danger-hover)}
.btn--compact{min-height:var(--control-height-compact);padding:0 var(--space-3)}
.btn--pill{border-radius:var(--radius-pill);padding:0 var(--space-5)}
.btn--accent{background:var(--color-action-accent);color:var(--color-text-on-accent);border-radius:var(--radius-pill);padding:0 var(--space-5);font-weight:var(--fw-bold)}
.btn--accent:hover:not(:disabled){background:var(--color-action-accent-hover)}
.btn--lg{min-height:52px;font-size:var(--fs-body-lg)}
.btn--icon{width:var(--button-height);padding:0}
.btn--compact.btn--icon{width:var(--control-height-compact)}
.btn--block{width:100%}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--color-bg-disabled);color:var(--color-text-disabled);border-color:var(--color-border-disabled);cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress}
.btn[aria-busy="true"] .spinner{display:inline-block}
.btn .spinner{display:none;width:16px;height:16px;border-width:2px}
@media (pointer:coarse){.btn--compact{min-height:var(--target-min)}.btn--compact.btn--icon{width:var(--target-min)}}

/* --- Form fields --- */
.field{display:grid;gap:var(--space-2);min-width:0}
.field + .field{margin-top:var(--space-4)}
.field__label{font:var(--fw-semibold) var(--fs-label)/1.4 var(--font-body);display:flex;gap:var(--space-2);align-items:baseline;flex-wrap:wrap}
.field__req,.field__opt{font-weight:var(--fw-regular);font-size:var(--fs-caption);color:var(--color-text-muted)}
.field__hint{font-size:var(--fs-caption);color:var(--color-text-muted);margin:0}
.field__error{display:flex;gap:var(--space-1);align-items:flex-start;font-size:var(--fs-caption);font-weight:var(--fw-semibold);color:var(--color-status-danger-fg);margin:0}
.field__success{display:flex;gap:var(--space-1);align-items:flex-start;font-size:var(--fs-caption);font-weight:var(--fw-semibold);color:var(--color-status-success-fg);margin:0}
.field__count{font-size:var(--fs-caption);color:var(--color-text-muted);text-align:right;margin:0}
.input{width:100%;min-height:var(--control-height);padding:0 var(--space-3);border:var(--border-width) solid var(--color-border-control);border-radius:var(--radius-md);background:var(--color-bg-input);color:var(--color-text);font:var(--fw-regular) var(--fs-input)/1.4 var(--font-body);transition:border-color var(--motion-fast) var(--ease-standard),box-shadow var(--motion-fast) var(--ease-standard)}
.input:focus{border-color:var(--color-action-primary)}
.input::placeholder{color:var(--color-text-muted);opacity:1}
.input:hover:not(:disabled):not([readonly]){border-color:var(--color-text-muted)}
.input[aria-invalid="true"]{border-color:var(--color-status-danger-fg);box-shadow:inset 0 0 0 1px var(--color-status-danger-fg)}
.input.is-valid{border-color:var(--color-status-success-fg)}
.input:disabled{background:var(--color-bg-disabled);color:var(--color-text-disabled);border-color:var(--color-border-disabled);cursor:not-allowed}
.input[readonly]{background:var(--color-bg-subtle);border-style:dashed}
textarea.input{min-height:104px;padding:var(--space-3);resize:vertical}
select.input{padding-right:var(--space-8)}
input[type="file"].input{padding:var(--space-2) var(--space-3)}
.input--compact{min-height:var(--control-height-compact);font-size:var(--fs-body)}
@media (pointer:coarse){.input--compact{min-height:var(--target-min);font-size:var(--fs-input)}}
.input-wrap{position:relative;display:flex}
.input-wrap .input{padding-right:calc(var(--button-height) + var(--space-2))}
.input-wrap .input-wrap__btn{position:absolute;right:2px;top:50%;transform:translateY(-50%);min-height:var(--target-min);min-width:var(--target-min);border:0;background:transparent;color:var(--color-text-muted);border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}

.error-summary{border:var(--border-width-strong) solid var(--color-status-danger-fg);background:var(--color-status-danger-bg);border-radius:var(--radius-md);padding:var(--space-4);color:var(--color-text)}

/* --- Choice controls --- */

/* --- Status badges --- */
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2);min-height:24px;border-radius:var(--radius-pill);border:var(--border-width) solid var(--color-status-neutral-border);background:var(--color-status-neutral-bg);color:var(--color-status-neutral-fg);font:var(--fw-semibold) var(--fs-caption)/1.3 var(--font-body);white-space:nowrap;vertical-align:middle}

.badge--warning{background:var(--color-status-warning-bg);color:var(--color-status-warning-fg);border-color:var(--color-status-warning-border)}

.badge--soft-info{background:var(--color-bg-info-soft);color:var(--color-text)}
.tag{display:inline-flex;align-items:center;gap:var(--space-2);padding:2px var(--space-2);min-height:24px;border-radius:var(--radius-sm);background:var(--color-bg-subtle);color:var(--color-text);font:var(--fw-medium) var(--fs-caption)/1.3 var(--font-body)}

/* --- Chips --- */
.chip{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--control-height-compact);padding:0 var(--space-3);border-radius:var(--radius-pill);border:var(--border-width) solid var(--color-border-control);background:var(--color-bg-surface);color:var(--color-text);font:var(--fw-semibold) var(--fs-body-sm)/1 var(--font-body);cursor:pointer}

/* --- Notices, banners, toasts --- */
.notice{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-3) var(--space-4);border:var(--border-width) solid var(--color-status-neutral-border);border-left-width:4px;border-radius:var(--radius-md);background:var(--color-status-neutral-bg);color:var(--color-text)}

.notice__actions{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
.notice--success{background:var(--color-status-success-bg);border-color:var(--color-status-success-border);border-left-color:var(--color-status-success-fg)} .notice--success > .icon{color:var(--color-status-success-fg)}
.notice--warning{background:var(--color-status-warning-bg);border-color:var(--color-status-warning-border);border-left-color:var(--color-status-warning-fg)} .notice--warning > .icon{color:var(--color-status-warning-fg)}
.notice--danger{background:var(--color-status-danger-bg);border-color:var(--color-status-danger-border);border-left-color:var(--color-status-danger-fg)} .notice--danger > .icon{color:var(--color-status-danger-fg)}

.banner__body{flex:1 1 280px}
.toast-region{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--space-6);z-index:var(--z-toast);display:grid;gap:var(--space-3);width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-2) var(--space-2) var(--space-4);background:var(--color-toast-bg);color:var(--color-toast-text);border-radius:var(--radius-md);box-shadow:var(--elevation-3);animation:toast-in var(--motion-base) var(--ease-standard)}

/* --- Tooltip --- */

.tooltip{position:absolute;left:50%;bottom:calc(100% + var(--space-2));transform:translateX(-50%);z-index:var(--z-tooltip);width:max-content;max-width:260px;padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--color-text);color:var(--color-bg-surface);font-size:var(--fs-caption);line-height:1.45;box-shadow:var(--elevation-1);visibility:hidden;opacity:0;transition:opacity var(--motion-fast) var(--ease-standard)}

/* --- Dialogs & drawers (native <dialog>) --- */
dialog.modal,dialog.drawer{border:0;padding:0;background:var(--color-bg-surface);color:var(--color-text);box-shadow:var(--elevation-3)}

/* --- Navigation --- */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:var(--space-3);min-height:var(--topbar-height);padding:0 var(--space-4);background:var(--color-bg-surface);border-bottom:var(--border-width) solid var(--color-border-divider);flex-wrap:wrap}

.brand-mark{width:34px;height:34px;border-radius:var(--radius-md);background:var(--color-action-primary);color:var(--color-text-on-brand);display:grid;place-items:center;font:var(--fw-extrabold) 16px/1 var(--font-display);letter-spacing:-.08em;flex:none}
.context-pill{display:inline-flex;gap:var(--space-2);align-items:center;min-height:var(--control-height-compact);padding:0 var(--space-4);border:var(--border-width) solid var(--color-border-control);border-radius:var(--radius-pill);background:var(--color-bg-surface);color:var(--color-text);font:var(--fw-semibold) var(--fs-body-sm)/1.2 var(--font-body);cursor:pointer}
.sidebar{background:var(--color-bg-surface);border-right:var(--border-width) solid var(--color-border-divider);padding:var(--space-3)}

.nav-item{display:flex;gap:var(--space-3);align-items:center;min-height:var(--target-min);padding:0 var(--space-3);border-radius:var(--radius-sm);color:var(--color-text);text-decoration:none;font-size:var(--fs-body);font-weight:var(--fw-medium)}

.app-main{padding:var(--space-5);min-width:0}
.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--color-bg-surface);border-top:var(--border-width) solid var(--color-border-divider);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav a{display:grid;justify-items:center;gap:2px;padding:var(--space-2) var(--space-1);min-height:56px;text-decoration:none;color:var(--color-text-muted);font-size:var(--fs-caption);font-weight:var(--fw-semibold)}

.phone{max-width:360px;margin:0 auto;border:var(--border-width) solid var(--color-border-control);border-radius:var(--radius-xl);overflow:hidden;background:var(--color-bg-canvas)}
.phone__top{display:flex;justify-content:space-between;align-items:center;padding:var(--space-2) var(--space-3);background:var(--color-bg-surface);border-bottom:var(--border-width) solid var(--color-border-divider)}
.phone__body{padding:var(--space-4);min-height:160px}
.breadcrumb ol{list-style:none;display:flex;flex-wrap:wrap;gap:var(--space-2);padding:0;margin:0;font-size:var(--fs-body-sm);align-items:center}
.breadcrumb li{display:flex;align-items:center;gap:var(--space-2);margin:0}
.breadcrumb li + li::before{content:"/";color:var(--color-text-muted)}
.breadcrumb [aria-current="page"]{font-weight:var(--fw-bold)}
.tabs [role="tablist"]{display:flex;gap:var(--space-1);border-bottom:var(--border-width) solid var(--color-border-divider);overflow-x:auto}
.tabs [role="tab"]{min-height:var(--target-min);padding:0 var(--space-4);border:0;border-bottom:3px solid transparent;background:transparent;color:var(--color-text-muted);font:var(--fw-semibold) var(--fs-body)/1 var(--font-body);cursor:pointer;white-space:nowrap}

.pagination{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;justify-content:space-between}

.pagination li{margin:0}
.page-btn{min-width:var(--control-height-compact);min-height:var(--control-height-compact);padding:0 var(--space-2);border:var(--border-width) solid var(--color-border-control);border-radius:var(--radius-sm);background:var(--color-bg-surface);color:var(--color-text);font:var(--fw-semibold) var(--fs-body-sm)/1 var(--font-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1)}

.menu-wrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:calc(100% + var(--space-1));z-index:var(--z-dropdown);min-width:220px;padding:var(--space-1);background:var(--color-bg-surface);border:var(--border-width) solid var(--color-border-divider);border-radius:var(--radius-md);box-shadow:var(--elevation-1);list-style:none;margin:0}

.menu li{margin:0}
.menu [role="separator"]{height:1px;background:var(--color-border-divider);margin:var(--space-1) 0}

/* --- KPI --- */
.kpi{display:grid;gap:var(--space-2);align-content:start}
.kpi__head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)}
.kpi__icon{width:32px;height:32px;border-radius:var(--radius-md);background:var(--color-bg-subtle);color:var(--color-text-brand);display:grid;place-items:center;flex:none}
.kpi__icon .icon{width:16px;height:16px}

/* --- Tables --- */
.table-wrap{position:relative;overflow-x:auto;border:var(--border-width) solid var(--color-border-divider);border-radius:var(--radius-lg);background:var(--color-bg-surface)}

.table tbody tr:last-child td{border-bottom:0}

.table--compact th,.table--compact td{padding:var(--space-2) var(--space-3)}
.table--fit{min-width:0}

.sort-btn{display:inline-flex;gap:var(--space-1);align-items:center;border:0;background:transparent;padding:var(--space-1) 0;color:inherit;font:inherit;cursor:pointer;min-height:32px}
.sort-btn .icon{width:16px;height:16px;color:var(--color-text-muted)}

.bulk-bar{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;padding:var(--space-2) var(--space-3);background:var(--color-bg-brand-soft);border:var(--border-width) solid var(--color-action-primary);border-radius:var(--radius-md);margin-bottom:var(--space-3)}

/* --- Identity --- */
.avatar{display:inline-grid;place-items:center;border-radius:50%;background:var(--color-bg-brand-soft);color:var(--color-text-brand);font:var(--fw-bold) 13px/1 var(--font-body);flex:none;overflow:hidden}
.avatar--sm{width:32px;height:32px;font-size:12px} .avatar--md{width:40px;height:40px} .avatar--lg{width:56px;height:56px;font-size:18px}
.avatar--alt{background:var(--color-status-info-bg);color:var(--color-status-info-fg)}

.avatar-stack .avatar{border:2px solid var(--color-bg-surface);margin-left:-8px}
.avatar-stack .avatar:first-child{margin-left:0}

/* --- Timeline --- */
.timeline{list-style:none;padding:0;margin:0;position:relative}
.timeline li{position:relative;padding:0 0 var(--space-4) var(--space-8);margin:0}
.timeline li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--color-border-divider)}
.timeline li:last-child::before{display:none}
.timeline__marker{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--color-bg-subtle);color:var(--color-text-muted);border:2px solid var(--color-bg-surface)}
.timeline__marker .icon{width:14px;height:14px}
.timeline__marker--done{background:var(--color-status-success-bg);color:var(--color-status-success-fg)}
.timeline__marker--current{background:var(--color-action-primary);color:var(--color-text-on-brand)}
.timeline__meta{font-size:var(--fs-caption);color:var(--color-text-muted);display:block}

/* --- Accordion --- */
.accordion details{border:var(--border-width) solid var(--color-border-divider);border-radius:var(--radius-md);background:var(--color-bg-surface)}
.accordion details + details{margin-top:var(--space-2)}
.accordion summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);min-height:var(--target-min);padding:0 var(--space-4);font-weight:var(--fw-semibold);cursor:pointer}
.accordion summary::-webkit-details-marker{display:none}
.accordion summary .icon{transition:transform var(--motion-fast) var(--ease-standard)}
.accordion details[open] summary .icon{transform:rotate(180deg)}
.accordion .accordion__body{padding:0 var(--space-4) var(--space-4)}

/* --- Stepper --- */
.stepper{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-2);counter-reset:step}
.stepper li{margin:0;padding:var(--space-3);border-radius:var(--radius-md);border:var(--border-width) solid var(--color-border-divider);background:var(--color-bg-surface);font-size:var(--fs-body-sm)}
.stepper__name{display:flex;gap:var(--space-2);align-items:center;font-weight:var(--fw-bold)}
.stepper__state{display:block;font-size:var(--fs-caption);color:var(--color-text-muted);margin-top:var(--space-1)}
.stepper li.is-done{background:var(--color-status-success-bg);border-color:var(--color-status-success-border)}
.stepper li.is-done .stepper__name .icon{color:var(--color-status-success-fg)}
.stepper li[aria-current="step"]{border:var(--border-width-strong) solid var(--color-action-primary);background:var(--color-bg-brand-soft)}

/* --- Progress & loading --- */
.progress{width:100%;height:8px;appearance:none;-webkit-appearance:none;border:0;border-radius:var(--radius-pill);background:var(--color-bg-subtle);overflow:hidden;display:block}
.progress::-webkit-progress-bar{background:var(--color-bg-subtle);border-radius:var(--radius-pill)}
.progress::-webkit-progress-value{background:var(--color-action-primary);border-radius:var(--radius-pill)}
.progress::-moz-progress-bar{background:var(--color-action-primary);border-radius:var(--radius-pill)}
.progress-label{display:flex;justify-content:space-between;gap:var(--space-2);font-size:var(--fs-body-sm);margin-bottom:var(--space-1)}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--color-bg-subtle);border-top-color:var(--color-action-primary);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.btn--primary .spinner{border-color:var(--color-spinner-track-on-brand);border-top-color:var(--color-text-on-brand)}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{display:block;height:12px;border-radius:var(--radius-sm);background:var(--color-bg-subtle);animation:pulse 1.4s var(--ease-standard) infinite alternate}
.skeleton--title{height:24px;width:55%} .skeleton--line{width:90%} .skeleton--short{width:40%} .skeleton--block{height:72px;width:100%}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.empty{display:grid;justify-items:center;text-align:center;gap:var(--space-2);padding:var(--space-8) var(--space-4)}
.empty__icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--color-bg-subtle);color:var(--color-text-muted)}
.empty p{max-width:40ch;color:var(--color-text-muted)}

/* --- Charts --- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--color-text-muted);font:var(--fw-medium) 12px var(--font-body)}
.chart .chart__value{fill:var(--color-text);font-weight:var(--fw-bold)}
.chart .chart__value--in{fill:var(--color-text-on-brand)}
.chart .chart__grid{stroke:var(--color-dv-grid);stroke-width:1}
.chart .chart__axis{stroke:var(--color-text-muted);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-3);list-style:none;padding:0;margin:var(--space-3) 0 0;font-size:var(--fs-body-sm)}
.legend li{display:flex;gap:var(--space-2);align-items:center;margin:0}
.legend__key{width:12px;height:12px;border-radius:3px;flex:none}
.donut{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap}
.donut svg{width:120px;height:120px;flex:none}

/* --- Calendar --- */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3)}
.cal-head h3,.cal-head h4{margin:0;font-size:var(--fs-h3)}
.cal{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.cal th{font-size:var(--fs-caption);font-weight:var(--fw-bold);color:var(--color-text-muted);padding:var(--space-1) 0;text-align:center}
.cal td{padding:0;vertical-align:top}
.cal-day{width:100%;min-height:72px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:var(--space-2);border:var(--border-width) solid var(--color-border-divider);border-radius:var(--radius-sm);background:var(--color-bg-surface);color:var(--color-text);font:var(--fw-semibold) var(--fs-body-sm)/1.2 var(--font-body);cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.cal-day:hover{border-color:var(--color-border-control)}
.cal-day.is-outside{color:var(--color-text-muted);background:var(--color-bg-canvas)}
.cal-day.is-today{border:var(--border-width-strong) solid var(--color-action-primary)}
.cal-day__today{font-weight:var(--fw-bold);color:var(--color-text-brand);font-size:12px}
[aria-selected="true"] > .cal-day{background:var(--color-action-primary);color:var(--color-text-on-brand);border-color:var(--color-action-primary)}
[aria-selected="true"] > .cal-day .cal-day__today{color:var(--color-text-on-brand)}
[aria-selected="true"] > .cal-day .cal-ev{background:var(--color-bg-surface);color:var(--color-text)}
.cal-ev{display:flex;gap:4px;align-items:center;width:100%;font-size:11px;font-weight:var(--fw-semibold);padding:2px 4px;border-radius:4px;background:var(--color-bg-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev .tag__dot{width:8px;height:8px}
.timetable th,.timetable td{text-align:left;vertical-align:top}
.slot{display:grid;gap:2px;padding:var(--space-2);border-radius:var(--radius-sm);border-left:4px solid var(--color-dv-1);background:var(--color-bg-canvas);font-size:var(--fs-body-sm)}
.slot strong{font-size:var(--fs-body-sm)}
.slot--lab{border-left-color:var(--color-dv-2)} .slot--exam{border-left-color:var(--color-dv-4)} .slot--free{border-left-color:var(--color-border-control);background:transparent;color:var(--color-text-muted)}
.slot--draft{border-left-style:dashed}

/* --- Upload --- */
.dropzone{display:grid;justify-items:center;gap:var(--space-2);text-align:center;padding:var(--space-6);border:var(--border-width-strong) dashed var(--color-border-control);border-radius:var(--radius-lg);background:var(--color-bg-canvas);cursor:pointer}
.dropzone:focus-within{outline:var(--focus-ring-width) solid var(--color-focus);outline-offset:var(--focus-ring-offset)}
.dropzone.is-dragover{background:var(--color-bg-brand-soft);border-color:var(--color-action-primary)}
.file-list{list-style:none;padding:0;margin:var(--space-3) 0 0;display:grid;gap:var(--space-2)}
.file-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-3);border:var(--border-width) solid var(--color-border-divider);border-radius:var(--radius-md);background:var(--color-bg-surface);margin:0}
.file-item__name{font-weight:var(--fw-semibold);overflow-wrap:anywhere}

/* --- Hero (dashboard welcome) --- */
.hero{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:var(--space-4);align-items:center;padding:var(--space-8);border-radius:var(--radius-xl);background:var(--color-hero-bg);color:var(--color-hero-text);min-height:190px}
.hero::after{content:"";position:absolute;z-index:-1;width:250px;height:250px;right:40px;top:-115px;border:1px solid var(--color-hero-line-faint);border-radius:50%;box-shadow:0 0 0 28px var(--color-hero-glow),0 0 0 57px var(--color-hero-glow-faint)}
.hero h3,.hero .hero__title{color:inherit;font:var(--fw-bold) var(--fs-h1)/var(--lh-h1) var(--font-display);letter-spacing:var(--ls-h1);margin:var(--space-3) 0 var(--space-2);max-width:560px}
.hero p{color:var(--color-hero-muted);max-width:520px;margin:0 0 var(--space-5)}
.hero .kicker{color:var(--color-hero-kicker)}
.hero__cta{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--button-height);padding:0 var(--space-5);border-radius:var(--radius-pill);border:0;background:var(--color-action-accent);color:var(--color-text-on-accent);font:var(--fw-bold) var(--fs-body)/1 var(--font-body);text-decoration:none;cursor:pointer}
.hero__cta:hover{background:var(--color-action-accent-hover)}
.hero__art{position:relative;width:124px;height:124px;justify-self:center}
.hero__art .halo{position:absolute;inset:0;border:1px solid var(--color-hero-line);border-radius:50%}
.hero__art .halo::before{content:"";position:absolute;inset:13px;border:1px solid var(--color-hero-line);opacity:.8;border-radius:50%}
.hero__art .leaf{position:absolute;left:37px;top:22px;width:52px;height:76px;border-radius:100% 0 100% 0;background:var(--color-action-accent);transform:rotate(26deg)}
.hero__art .leaf::after{content:"";position:absolute;width:1px;height:65px;left:24px;top:7px;background:var(--color-hero-bg);transform:rotate(13deg)}
.hero__art .star{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--color-hero-star);right:3px;top:29px}

/* --- Masked data --- */
.masked{font-family:var(--font-mono);letter-spacing:.04em}

/* --- Receipt --- */
.receipt{max-width:560px;border:var(--border-width) solid var(--color-border-control);border-radius:var(--radius-lg);background:var(--color-bg-surface);padding:var(--space-6)}
.receipt__head{display:flex;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;border-bottom:var(--border-width) solid var(--color-border-divider);padding-bottom:var(--space-4);margin-bottom:var(--space-4)}
.receipt table{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
.receipt td,.receipt th{padding:var(--space-2) 0;border-bottom:var(--border-width) solid var(--color-border-divider);text-align:left}
.receipt td.num,.receipt th.num{text-align:right;font-variant-numeric:tabular-nums}
.receipt tfoot td{font-weight:var(--fw-bold);border-bottom:0;font-size:var(--fs-body-lg)}

/* --- Roster (attendance) --- */
.mark-group{display:inline-flex;gap:var(--space-1);flex-wrap:wrap}
.mark-group input{position:absolute;opacity:0;width:1px;height:1px}
.mark-group label{min-width:var(--control-height-compact);min-height:var(--control-height-compact);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);padding:0 var(--space-2);border:var(--border-width) solid var(--color-border-control);border-radius:var(--radius-sm);font-weight:var(--fw-bold);font-size:var(--fs-body-sm);cursor:pointer;background:var(--color-bg-surface)}
.mark-group input:focus-visible + label{outline:var(--focus-ring-width) solid var(--color-focus);outline-offset:1px}
.mark-group input[value="P"]:checked + label{background:var(--color-status-success-bg);border-color:var(--color-status-success-fg);color:var(--color-status-success-fg)}
.mark-group input[value="A"]:checked + label{background:var(--color-status-danger-bg);border-color:var(--color-status-danger-fg);color:var(--color-status-danger-fg)}
.mark-group input[value="L"]:checked + label{background:var(--color-status-warning-bg);border-color:var(--color-status-warning-fg);color:var(--color-status-warning-fg)}
.mark-group input[value="E"]:checked + label{background:var(--color-status-info-bg);border-color:var(--color-status-info-fg);color:var(--color-status-info-fg)}
.mark-group input:checked + label::before{content:"✓";font-weight:var(--fw-extrabold)}
@media (pointer:coarse){.mark-group label{min-width:var(--target-min);min-height:var(--target-min)}}

/* =====================================================================
   v2.1 COMPONENTS · adopted from the approved student prototype
   ===================================================================== */
/* --- Brand lockup --- */
.brand-lockup{display:inline-flex;align-items:center;gap:var(--space-3);color:var(--color-text);text-decoration:none;min-height:var(--target-min)}
.brand-lockup__symbol{width:38px;height:38px;border-radius:14px;background:var(--color-action-primary);color:var(--color-text-on-brand);display:grid;place-items:center;font:var(--fw-extrabold) 17px/1 var(--font-display);letter-spacing:-.08em;flex:none}
.brand-lockup__text{display:grid;gap:3px}
.brand-lockup__name{display:block;font:var(--fw-extrabold) 16px/1.1 var(--font-display);letter-spacing:-.05em}
.brand-lockup__tagline{display:block;font:var(--fw-bold) 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted)}
.brand-lockup--sm .brand-lockup__symbol{width:34px;height:34px;border-radius:12px;font-size:15px}
.brand-lockup--sm .brand-lockup__name{font-size:14px}
/* --- Kicker --- */
.kicker{display:flex;align-items:center;gap:var(--space-2);margin:0;font:var(--fw-extrabold) 12px/1.3 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--color-text-brand)}
.kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--color-accent);flex:none}
/* --- Icon button with count --- */
.icon-btn{position:relative;width:var(--target-min);height:var(--target-min);border-radius:50%;border:var(--border-width) solid var(--color-border-control);background:var(--color-bg-surface);color:var(--color-text);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--color-bg-subtle)}
.icon-btn__count{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:var(--radius-pill);background:var(--color-action-danger);color:var(--color-text-on-danger);font:var(--fw-bold) 12px/20px var(--font-body);text-align:center;border:2px solid var(--color-bg-canvas)}
.chip-context{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--target-min);padding:0 var(--space-4);border:var(--border-width) solid var(--color-border-control);border-radius:var(--radius-pill);background:var(--color-bg-surface);color:var(--color-text);font:var(--fw-semibold) var(--fs-body-sm)/1.2 var(--font-body);white-space:nowrap}
/* --- Page header (greeting) --- */
.page-header{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap}
.page-header__title{font:var(--fw-bold) var(--fs-display)/var(--lh-display) var(--font-display);letter-spacing:var(--ls-display);margin:var(--space-2) 0 var(--space-1)}
.page-header__sub{color:var(--color-text-muted);margin:0}
.page-header__tools{display:flex;gap:var(--space-2);align-items:center}
/* --- Panel --- */
.panel{background:var(--color-bg-surface);border:var(--border-width) solid var(--color-border-divider);border-radius:var(--radius-lg);padding:var(--space-5);min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);margin-bottom:var(--space-4)}
.panel-head h3,.panel-head h4{margin:0;font:var(--fw-bold) var(--fs-h3)/var(--lh-h3) var(--font-display);letter-spacing:var(--ls-h3)}
.panel-head p{margin:var(--space-1) 0 0;font-size:var(--fs-body-sm);color:var(--color-text-muted)}
.link-action{display:inline-flex;align-items:center;gap:var(--space-1);min-height:var(--target-min);padding:0 var(--space-2);margin:calc(var(--space-3) * -1) calc(var(--space-2) * -1) 0 0;border:0;background:transparent;border-radius:var(--radius-sm);color:var(--color-text-brand);font:var(--fw-bold) var(--fs-body-sm)/1 var(--font-body);text-decoration:none;white-space:nowrap;cursor:pointer}
.link-action:hover{text-decoration:underline;text-underline-offset:3px}
.link-action .icon{width:16px;height:16px}
/* --- Week strip --- */
.week-strip{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2);padding:0;margin:0 0 var(--space-4)}
.week-strip li{margin:0;display:grid;justify-items:center;gap:2px;padding:var(--space-2) var(--space-1);border:var(--border-width) solid transparent;border-radius:var(--radius-md);font-size:var(--fs-caption);color:var(--color-text-muted)}
.week-strip strong{font:var(--fw-bold) 16px/1.2 var(--font-display);color:var(--color-text);font-variant-numeric:tabular-nums}
.week-strip li[aria-current="date"]{background:var(--color-bg-brand-soft);border-color:var(--color-action-primary);color:var(--color-text-brand-strong)}
.week-strip li[aria-current="date"] strong{color:var(--color-text-brand-strong)}
.week-strip__today{font-weight:var(--fw-bold);color:var(--color-text-brand-strong)}
/* --- Class row --- */
.class-list{list-style:none;padding:0;margin:0}
.class-row{display:grid;grid-template-columns:72px 4px minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-3) 0;border-top:var(--border-width) solid var(--color-border-divider);margin:0}
.class-row__time{font-size:var(--fs-caption);color:var(--color-text-muted);line-height:1.45;font-variant-numeric:tabular-nums}
.class-row__marker{height:44px;border-radius:var(--radius-pill);background:var(--color-dv-1)}
.class-row--lab .class-row__marker{background:var(--color-dv-2)}
.class-row--tutorial .class-row__marker{background:var(--color-dv-5)}
.class-row--exam .class-row__marker{background:var(--color-dv-4)}
.class-row__title{display:block;font-weight:var(--fw-bold);font-size:var(--fs-body);line-height:1.35}
.class-row__meta{display:block;font-size:var(--fs-caption);color:var(--color-text-muted);margin-top:2px}
.class-row.is-done .class-row__title{color:var(--color-text-muted)}
/* --- Task item --- */
.task-list{list-style:none;padding:0;margin:0;display:grid;gap:var(--space-2)}
.task-list li{margin:0}
.task-item{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3);border:var(--border-width) solid var(--color-border-divider);border-radius:var(--radius-md);cursor:pointer;min-height:var(--target-min)}
.task-item:hover{border-color:var(--color-border-control)}
.task-item input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--color-action-primary);flex:none}
.task-item__body{flex:1;min-width:0}
.task-item__title{display:block;font-weight:var(--fw-bold);font-size:var(--fs-body)}
.task-item__detail{display:block;font-size:var(--fs-caption);color:var(--color-text-muted);margin-top:2px}
.task-item.is-done .task-item__title{text-decoration:line-through;color:var(--color-text-muted)}
.task-item.is-done{background:var(--color-bg-canvas)}
/* --- Notice list with date badge --- */
.notice-list{list-style:none;padding:0;margin:0}
.notice-list li{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) 0;border-top:var(--border-width) solid var(--color-border-divider);margin:0}
.date-badge{flex:none;width:44px;padding:var(--space-1) 0;border-radius:var(--radius-md);background:var(--color-bg-subtle);text-align:center;font:var(--fw-bold) 12px/1.2 var(--font-body);color:var(--color-text-muted);text-transform:uppercase}
.date-badge strong{display:block;font:var(--fw-bold) 16px/1.2 var(--font-display);color:var(--color-text)}
.notice-list__title{display:block;font-weight:var(--fw-bold)}
.notice-list p{font-size:var(--fs-body-sm);color:var(--color-text-muted);margin:2px 0 0}
/* --- Result row --- */
.result-list{list-style:none;padding:0;margin:0}
.result-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-top:var(--border-width) solid var(--color-border-divider);margin:0}
.result-row:first-child{border-top:0}
.subject-tile{width:36px;height:36px;border-radius:var(--radius-md);background:var(--color-bg-info-soft);color:var(--color-text);display:grid;place-items:center;flex:none}
.subject-tile .icon{width:18px;height:18px}
.subject-tile--accent{background:var(--color-bg-accent-soft)} .subject-tile--rose{background:var(--color-bg-rose-soft)}
.result-row__body{flex:1;min-width:0}
.result-row__title{display:block;font-weight:var(--fw-bold)}
.result-row__meta{display:block;font-size:var(--fs-caption);color:var(--color-text-muted)}
.grade{font:var(--fw-bold) 20px/1 var(--font-display);color:var(--color-text-brand);min-width:2ch;text-align:right}
/* --- Sidebar (floating card) --- */
.side-card{background:var(--color-bg-surface);border:var(--border-width) solid var(--color-border-divider);border-radius:var(--radius-lg);box-shadow:var(--elevation-card);padding:var(--space-4) var(--space-3);display:flex;flex-direction:column;gap:var(--space-1);min-width:0}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function parseISO(iso) { const [y, m, d] = String(iso).split('-').map(Number); return new Date(y, m - 1, d); }
function isoOf(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function fmtDate(iso) { if (!iso) return '—'; const d = parseISO(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDateLong(iso) { const d = parseISO(iso); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`; }
function fmtTime(d) { let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0'); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${m} ${ap}`; }
function fmtStamp(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${fmtTime(d)}`; }
function fmtINR(n) { return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtINRWhole(n) { return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000) + 1; }
function pct(a, b) { return b ? Math.round((a / b) * 1000) / 10 : 0; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function initials(n) { return String(n).split(/\s+/).filter(Boolean).map(x => x[0]).slice(0, 2).join('').toUpperCase(); }
function seq(prefix, list, width = 4) { return `${prefix}-${String(list.length + 1).padStart(width, '0')}`; }

FORMS.signin = f => {
  const id = val(f, 'si-id'), pw = f.querySelector('#si-pw').value, errs = [];
  if (!id) errs.push({ id: 'si-id', msg: 'Enter your school email or student ID.' });
  else if (!/^\S+@\S+\.\S+$/.test(id) && !/^[A-Z]{3}-\d{4}-\d{5}$/i.test(id)) errs.push({ id: 'si-id', msg: 'Enter an email like name@greenwood.edu.in or an ID like STU-2026-01042.' });
  if (!pw) errs.push({ id: 'si-pw', msg: 'Enter your password.' });
  if (!showErrors(f, errs)) return;
  state.signedIn = true; audit('Signed in', ROLES[state.role].person); go('overview'); toast('success', `Signed in as ${ROLES[state.role].person}`, 'Sample session · no credentials were sent.');
};

    ${panel({ title: 'Decision history', sub: 'This session', body: hist.length ? timeline(hist.map(a => ({ text: `${a.action} · ${a.target}`, at: `${a.at} · ${a.actor}` }))) : '<p class="caption">No decisions yet.</p>' })}` };

ACT.review = d => {
  let title, detail;
  if (d.kind === 'leave') { const l = state.leave.find(x => x.id === d.id); title = `Leave · ${l.name}`; detail = leaveDetail(l); }
  if (d.kind === 'correction') { const c = state.corrections.find(x => x.id === d.id); title = `Correction · ${studentById(c.studentId).name}`; detail = `<dl class="dl"><dt>Session</dt><dd>${CLASS_LIST[c.cls]} · ${c.subject} · ${c.period} · ${fmtDate(c.date)}</dd><dt>Change</dt><dd>${badge(statusWord(c.from))} → ${badge(statusWord(c.to))}</dd><dt>Requested by</dt><dd>${esc(c.requester)} · ${esc(c.at)}</dd><dt>Reason</dt><dd>${esc(c.reason)}</dd></dl>`; }
  if (d.kind === 'marks') { const m = state.marksheets.find(x => x.id === d.id); title = `${m.title} · ${m.subject} · ${CLASS_LIST[m.cls]}`; detail = marksStats(m) + marksTable(m, true); }
  if (d.kind === 'fee') { const f = state.feeStructures.find(x => x.id === d.id); const prev = state.feeStructures.find(x => x.name === f.name && x.status === 'Approved'); title = `${f.name} · version ${f.version}`; detail = `<dl class="dl"><dt>Fee head</dt><dd>${esc(f.head)}</dd><dt>Installments</dt><dd>${f.count} × ${fmtINR(f.amount)} = ${fmtINR(f.count * f.amount)}</dd>${prev ? `<dt>Current version</dt><dd>v${prev.version}: ${prev.count} × ${fmtINR(prev.amount)}</dd>` : ''}<dt>Due dates</dt><dd>${f.dues.map(fmtDate).join(', ')}</dd><dt>Drafted by</dt><dd>${esc(f.by)}</dd></dl>`; }
  openDialog({ title, wide: d.kind === 'marks', form: 'decision', body: `<input type="hidden" id="dec-kind" value="${d.kind}"><input type="hidden" id="dec-id" value="${d.id}">${detail}<div style="height:var(--space-4)"></div>${radios('dec', 'Your decision', [['Approved', 'Approve'], ['Rejected', 'Reject']], '')}${field({ id: 'dec-remark', label: 'Remark', type: 'textarea', hint: 'Required when rejecting. The requester sees it.', maxlength: 300, rows: 3 })}`, actions: btn('Cancel', { act: 'closeDialog' }) + btn('Record decision', { type: 'submit', variant: 'primary' }) });
};
FORMS.decision = f => {
  const kind = f.querySelector('#dec-kind').value, id = f.querySelector('#dec-id').value, dec = radioVal(f, 'dec'), remark = val(f, 'dec-remark'), errs = [];
  if (!dec) errs.push({ id: 'dec', msg: 'Choose approve or reject.' }); if (dec === 'Rejected' && !remark) errs.push({ id: 'dec-remark', msg: 'Enter a remark explaining the rejection.' });
  if (!showErrors(f, errs)) return; const stamp = fmtStamp(demoNow()), entry = { at: stamp, text: `${dec} by ${actor()}${remark ? ': ' + remark : ''}` };
  if (kind === 'leave') { const l = state.leave.find(x => x.id === id); if (!canDecideLeave(l)) { closeDialog(); return deny('decide leave'); } l.status = dec; l.decisionBy = actor(); l.remark = remark; l.history.push(entry); notify([l.requesterRole], `Leave ${dec.toLowerCase()} · ${fmtDate(l.from)}`, 'leave'); audit(dec + ' leave', l.name); }
  if (kind === 'correction') { if (!guard('attendance.correct.dec', 'decide correction')) return; const c = state.corrections.find(x => x.id === id); if (c.requester === actor()) return deny('self-approval'); c.status = dec; c.remark = remark; if (dec === 'Approved') { const r = state.registers.find(x => x.id === c.registerId); r.rows[c.studentId] = c.to; r.history.push({ at: stamp, text: `${studentById(c.studentId).name}: ${statusWord(c.from)} → ${statusWord(c.to)} (approved by ${actor()})` }); } audit(dec + ' attendance correction', studentById(c.studentId).name); notify(['Teacher'], `Attendance correction ${dec.toLowerCase()}`, 'attendance'); }
  if (kind === 'marks') { if (!guard('marks.review', 'review results')) return; const m = state.marksheets.find(x => x.id === id); if (m.by === actor()) return deny('self-approval'); m.status = dec; m.history.push(entry); audit(dec + ' results', `${m.title} · ${m.subject} · ${CLASS_LIST[m.cls]}`); notify(['Teacher'], `${m.title} · ${CLASS_LIST[m.cls]} ${dec.toLowerCase()}`, 'marks'); }
  if (kind === 'fee') { if (!guard('fee.structure.decide', 'decide fee structure')) return; const s = state.feeStructures.find(x => x.id === id); if (s.by === actor()) return deny('self-approval'); s.status = dec; s.approvedBy = dec === 'Approved' ? actor() : undefined; s.history.push(entry); audit(dec + ' fee structure', `${s.name} v${s.version}`); notify(['Accountant'], `${s.name} v${s.version} ${dec.toLowerCase()}`, 'fee-structures'); }
  closeDialog(); render(); toast('success', `Decision recorded: ${dec}`, remark || undefined);
};

  ['C13 Upload', 'Assignment submission, leave document, bulk import', 'assignments'], ['C14 Brand & header', 'Brand lockup, kicker, context chip, notification count', 'overview'], ['C15 Sign-in', 'Sign out to see T1', 'overview'], ['C16 Dashboard content', 'Panels, class rows, notices, results, sidebar, footer', 'overview'], ['P6 Education', 'Attendance register, marks entry, fee receipt', 'payments'], ['T1 / T2 Templates', 'Sign-in, student dashboard', 'overview']];
  return { title: 'Component coverage', kicker: 'Prototype tool', sub: 'Where each Master Design System v2.1 component is demonstrated in this prototype.', body: `${panel({ title: 'Coverage', sub: 'Open a role page to see each live', body: table({ caption: 'Component coverage', cols: [{ label: 'Component' }, { label: 'Demonstrated in' }, { label: 'Status' }], rows: rows.map(r => [esc(r[0]), esc(r[1]), badge('Complete', 'Demonstrated')]) }) })}${panel({ title: 'Live samples', sub: 'States that are hard to reach in the flows', body: `<div class="coverage-live">${btn('Primary', { variant: 'primary' })}${btn('Secondary')}${btn('Tertiary', { variant: 'tertiary' })}${btn('Danger', { variant: 'danger' })}${btn('Pill', { pill: true })}${btn('Disabled', { disabled: true })}${btn('Success toast', { act: 'demoToast', data: { k: 'success' } })}${btn('Error toast', { act: 'demoToast', data: { k: 'danger' } })}</div><div style="height:var(--space-3)"></div><div class="banner banner--offline" role="status">${I('wifi-off')}<div class="banner__body"><strong>You're offline.</strong> Showing data last synced at 10:15 AM.</div></div><div style="height:var(--space-3)"></div><div class="stack stack--sm" aria-hidden="true"><span class="skeleton skeleton--title"></span><span class="skeleton skeleton--line"></span></div>` })}` }; };

/* ---------------------------------------------------------------- global actions */
ACT.closeDialog = () => closeDialog();
ACT.focusField = d => document.getElementById(d.id)?.focus();
ACT.reveal = (d, el) => { const i = document.getElementById(el.getAttribute('aria-controls')); const on = el.getAttribute('aria-pressed') !== 'true'; el.setAttribute('aria-pressed', String(on)); i.type = on ? 'text' : 'password'; };
ACT.authMsg = d => { document.getElementById('auth-status').textContent = d.msg; };
ACT.signOut = () => { audit('Signed out', actor()); state.signedIn = false; location.hash = '#/overview'; render(); };
ACT.reset = () => { if (confirmReset()) { state = seedState(); state.signedIn = true; go('overview'); toast('info', 'Demo reset', 'All sample data restored.'); } };
function confirmReset() { return true; }
ACT.openNotifications = () => { const list = state.notifications.filter(n => n.roles.includes(state.role)); openDialog({ drawer: true, title: 'Notifications', body: list.length ? list.map(n => `<a class="link-row" href="#/${n.route}" data-act="readNote" data-id="${n.id}"><span class="link-row__icon" aria-hidden="true">${I('bell')}</span><span class="link-row__body"><span class="link-row__title">${esc(n.text)}</span><span class="link-row__meta">${esc(n.at)}</span></span>${n.read ? '' : badge('Next up', 'New')}</a>`).join('') + `<div class="form-actions">${btn('Mark all as read', { act: 'readAll', variant: 'primary' })}</div>` : empty('bell', 'No notifications', '') }); };
ACT.readNote = (d, el, e) => { state.notifications.find(n => n.id === d.id).read = true; closeDialog(); location.hash = el.getAttribute('href'); };
ACT.readAll = () => { state.notifications.forEach(n => { if (n.roles.includes(state.role)) n.read = true; }); closeDialog(); render(); };
ACT.openMore = () => { const r = ROLES[state.role]; openDialog({ drawer: true, title: 'Menu', body: r.nav.map(([g, items]) => `<p class="side-card__group">${esc(g)}</p>${items.map(([l, route, ic]) => `<a class="nav-item" href="#/${route}"${state.route === route ? ' aria-current="page"' : ''}>${I(ic)}<span>${esc(l)}</span></a>`).join('')}`).join('') + `<hr>${btn('Sign out', { act: 'signOut', icon: 'return', variant: 'tertiary' })}` }); };
ACT.removeFile = d => { state.uploads[d.key].splice(Number(d.i), 1); render(); announce('File removed'); };
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }

/* ---------------------------------------------------------------- event delegation */
document.addEventListener('click', e => {
  const m = e.target.closest('[data-menu]');
  document.querySelectorAll('.menu:not([hidden])').forEach(x => { if (!m || x.id !== m.dataset.menu) { x.hidden = true; document.getElementById(x.id + '-btn')?.setAttribute('aria-expanded', 'false'); } });
  if (m) { const menuEl = document.getElementById(m.dataset.menu); const open = menuEl.hidden; menuEl.hidden = !open; m.setAttribute('aria-expanded', String(open)); if (open) menuEl.querySelector('[role=menuitem]')?.focus(); return; }
  const tab = e.target.closest('[role=tab]'); if (tab) { selectTab(tab); return; }
  if (e.target.closest('[data-theme-toggle]')) { setTheme(document.documentElement.dataset.theme !== 'dark'); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A' || el.dataset.act !== 'openRegister') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form] && FORMS[f.dataset.form](f, e); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'proto-role') { state.role = el.value; audit('Prototype: preview role changed', el.value); state.param = ''; state.ui.approvalsTab = 'all'; if (location.hash === '#/overview') render(); else location.hash = '#/overview'; return; }
  if (el.dataset.upload) { const key = el.dataset.upload, max = Number(el.dataset.max || 3), list = state.uploads[key] = state.uploads[key] || []; [...el.files].forEach(f => { if (list.length >= max) { toast('danger', `Up to ${max} file${max > 1 ? 's' : ''}`); return; } const okType = /\.(pdf|jpe?g|png|csv|xlsx)$/i.test(f.name) && (el.accept || '').split(',').some(a => f.name.toLowerCase().endsWith(a.trim())), okSize = f.size <= 5 * 1048576; list.push({ name: f.name, size: f.size < 1048576 ? Math.max(1, Math.round(f.size / 1024)) + ' KB' : (f.size / 1048576).toFixed(1) + ' MB', ok: okType && okSize, err: !okType ? 'Wrong file type' : 'Larger than 5 MB' }); }); render(); announce('File list updated'); return; }
  if (el.id === 'lv-from' || el.id === 'lv-to') { CHANGE.leaveDates(); return; }
  if (el.id === 'att-cls') { state.ui.attClass = el.value; render(); return; }
  if (el.dataset.change && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'usersQuery') { state.ui.usersQuery = el.value; state.ui.usersPage = 1; render(); return; }
  if (el.dataset.count) { const c = document.getElementById(el.dataset.count); if (c) c.textContent = `${el.value.length} of ${el.maxLength} characters`; }
});
document.addEventListener('keydown', e => {
  const mi = e.target.closest('[role=menuitem]');
  if (mi) { const items = [...mi.closest('.menu').querySelectorAll('[role=menuitem]')], i = items.indexOf(mi); if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); } if (e.key === 'Escape') { const m = mi.closest('.menu'); m.hidden = true; document.getElementById(m.id + '-btn').focus(); } if (e.key === 'Tab') mi.closest('.menu').hidden = true; return; }
  const tab = e.target.closest('[role=tab]');
  if (tab) { const tabs = [...tab.parentElement.querySelectorAll('[role=tab]')], i = tabs.indexOf(tab), map = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }; if (e.key in map) { e.preventDefault(); selectTab(tabs[map[e.key]]); tabs[map[e.key]].focus(); } return; }
  const day = e.target.closest('.cal-day');
  if (day) { const steps = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }; if (e.key in steps) { e.preventDefault(); const d = parseISO(day.dataset.date); d.setDate(d.getDate() + steps[e.key]); const iso = isoOf(d); state.ui.calSelected = iso; state.ui.calMonth = iso.slice(0, 7); render(); document.querySelector(`[data-date="${iso}"]`)?.focus(); } }
  if (e.key === 'Escape') { document.querySelectorAll('.tooltip-wrap').forEach(w => w.classList.add('is-dismissed')); }
});
document.addEventListener('focusout', e => { const w = e.target.closest?.('.tooltip-wrap'); if (w) w.classList.remove('is-dismissed'); });
function selectTab(tab) { const list = tab.parentElement; list.querySelectorAll('[role=tab]').forEach(t => { const on = t === tab; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; document.getElementById(t.getAttribute('aria-controls')).hidden = !on; }); }

/* V4.0 ROLE ROLL-DOWN · prototype-only local interactions; no API or persistence */
const RD_ROWS=[
{id:'school-approval',scope:'Greenwood Public School',level:'School',missing:'Vice Principal',kind:'Approval',rights:'Attendance corrections · student discipline',acting:'School Principal',choices:['School Principal'],approval:true},
{id:'school-ops',scope:'Greenwood Public School',level:'School',missing:'Management',kind:'Operational',rights:'Staff records · notices · routine administration',acting:'School Admin',choices:['School Admin','School Principal'],approval:false},
{id:'school-academic',scope:'Greenwood Public School',level:'School',missing:'Vice Principal',kind:'Operational',rights:'Timetable coordination · academic operations',acting:'School Admin',choices:['School Admin','School Principal'],approval:false},
{id:'university-approval',scope:'Northbridge University',level:'University',missing:'Vice-Chancellor',kind:'Approval',rights:'University-level approvals',acting:'Unresolved',choices:['Vice-Chancellor'],approval:true},
{id:'university-ops',scope:'Northbridge University',level:'University',missing:'Management',kind:'Operational',rights:'University administration · institution coordination',acting:'University Admin',choices:['University Admin','Vice-Chancellor'],approval:false}
];
let rdLocal={overrides:{},history:[]};
function rdRows(){return RD_ROWS.filter(r=>state.role==='University Admin'?r.level==='University':r.level==='School');}
function rdCan(r){return state.role==='Principal'||(state.role==='University Admin'&&!r.approval);}
function rdValue(r){return rdLocal.overrides[r.id]||{acting:r.acting,source:'Default roll-down'};}
PAGES.rolldown=function(){const rows=rdRows();const count=rows.filter(r=>rdLocal.overrides[r.id]).length;const unresolved=rows.filter(r=>rdValue(r).acting==='Unresolved').length;return {title:'Missing roles',kicker:'V4.0 · role roll-down',sub:'Review who acts when a role is vacant and manage eligible temporary overrides.',body:
notice('info','How role roll-down works','Approval responsibilities go to the head of the next level down. Other operational responsibilities go to that level’s admin. This is a prototype preview using sample data.')+
(unresolved?notice('warning','Unresolved responsibility','No eligible stand-in is available. The issue is surfaced to the next level above. Approval work cannot be withheld.'): '')+
panel({title:'Missing roles and acting responsibilities',sub:state.role==='University Admin'?'Northbridge University · university scope':'Greenwood Public School · school scope',body:table({caption:'Role roll-down responsibilities',cols:[{label:'Missing role'},{label:'Responsibility'},{label:'Who acts now'},{label:'Basis'},{label:'Actions'}],rows:rows.map(r=>{const v=rdValue(r);return ['<strong>'+esc(r.missing)+'</strong><span class="table__meta">'+esc(r.scope)+'</span>',esc(r.kind)+'<span class="table__meta">'+esc(r.rights)+'</span>',esc(v.acting),esc(v.source), (rdCan(r)?btn('Change',{act:'rdChange',data:{id:r.id},compact:true}):'<span class="caption">Managed by next level above</span>')+(rdLocal.overrides[r.id]?btn('Revoke',{act:'rdRevoke',data:{id:r.id},variant:'tertiary',compact:true}):'')];})})})+
panel({title:'Guardrails',body:'<ul class="list"><li>Approval responsibilities can be reassigned but never withheld.</li><li>No self-approval or preparer approval; separation of duties still applies.</li><li>Students, parents, applicants and platform roles are not eligible stand-ins.</li><li>Only the level above may change a roll-down. University Admin may change non-approval rights only.</li><li>Changes are labelled as acting for the missing role and recorded in the prototype activity history.</li></ul>'})+
panel({title:'Recent prototype activity',sub:'Local demo actions only',body:rdLocal.history.length?table({caption:'Role roll-down activity',cols:[{label:'Action'},{label:'Actor'},{label:'Detail'}],rows:rdLocal.history.map(h=>[esc(h.action),esc(h.actor),esc(h.detail)])}):empty('clock','No changes yet','Change or revoke a roll-down to see activity here.')})}};
ACT.rdChange=function(d){const r=RD_ROWS.find(x=>x.id===d.id);if(!r||!rdCan(r))return;const opts=r.choices.map(x=>[x,x]);openDialog({title:'Change acting responsibility',wide:true,form:'rdForm',body:'<p class="field__hint">'+esc(r.scope)+' · '+esc(r.missing)+' is unfilled</p>'+notice('info',r.kind+' responsibility',r.rights+(r.approval?' · Approval responsibility cannot be withheld.':''))+field({id:'rd-acting',label:'Who should act?',options:opts,value:rdValue(r).acting==='Unresolved'?opts[0][0]:rdValue(r).acting,req:true})+(r.approval?'':'<label class="check"><input type="checkbox" id="rd-withhold"> Withhold this non-approval responsibility until appointment</label>')+field({id:'rd-reason',label:'Reason for change',type:'textarea',rows:3,req:true,placeholder:'Explain why this temporary change is needed.'})+'<input type="hidden" id="rd-id" value="'+esc(r.id)+'">',actions:btn('Cancel',{act:'closeDialog',variant:'tertiary'})+'<button class="btn btn--primary" type="submit">Save override</button>'});};
FORMS.rdForm=function(f){const id=f.querySelector('#rd-id').value,r=RD_ROWS.find(x=>x.id===id),reason=f.querySelector('#rd-reason').value.trim(),withheld=!!f.querySelector('#rd-withhold')?.checked;const errors=[];if(reason.length<5)errors.push({id:'rd-reason',msg:'Enter a reason of at least 5 characters.'});if(withheld&&r.approval)errors.push({id:'rd-reason',msg:'Approval responsibilities cannot be withheld.'});if(!showErrors(f,errors))return;rdLocal.overrides[id]={acting:withheld?'Withheld':f.querySelector('#rd-acting').value,source:'Manual override',reason:reason};rdLocal.history.unshift({action:'Override set',actor:actor(),detail:r.missing+' · '+rdLocal.overrides[id].acting+' · '+reason});audit('Role roll-down override set',r.missing+' · '+r.scope);closeDialog();render();toast('success','Override saved','The sample view now reflects the change.');};
ACT.rdRevoke=function(d){const r=RD_ROWS.find(x=>x.id===d.id);if(!r||!rdLocal.overrides[d.id])return;openDialog({title:'Revoke override',body:'<p>Revoke the override for <strong>'+esc(r.missing)+'</strong> at '+esc(r.scope)+'?</p><p class="field__hint">The default roll-down rule will apply again in this prototype.</p>',actions:btn('Keep override',{act:'closeDialog',variant:'tertiary'})+btn('Revoke override',{act:'rdConfirmRevoke',data:{id:r.id},variant:'danger'})});};
ACT.rdConfirmRevoke=function(d){const r=RD_ROWS.find(x=>x.id===d.id);if(!r)return;delete rdLocal.overrides[d.id];rdLocal.history.unshift({action:'Override revoked',actor:actor(),detail:r.missing+' · default roll-down restored'});audit('Role roll-down override revoked',r.missing+' · '+r.scope);closeDialog();render();toast('success','Override revoked','The default roll-down applies again.');};
